<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagonal Tech Ring -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="url(#cosGrad)" stroke-width="4" fill="rgba(15, 23, 42, 0.6)" filter="url(#glow)"/>
  <!-- Inner Orbit and Node Structure -->
  <circle cx="50" cy="50" r="22" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
  <circle cx="50" cy="50" r="10" fill="url(#cosGrad)" />
  <circle cx="50" cy="22" r="3" fill="#22d3ee" />
  <circle cx="74" cy="64" r="3" fill="#818cf8" />
  <circle cx="26" cy="64" r="3" fill="#c084fc" />
</svg>
