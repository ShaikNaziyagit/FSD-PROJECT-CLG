<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="campiiOrangeShield" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="campiiOrangeFrost" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1a0f07" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="campiiOrangeTower" x1="24" y1="14" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="campiiOrangeBevel" x1="16" y1="6" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="campiiOrangeOrbit" x1="4" y1="32" x2="60" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Core -->
  <circle cx="32" cy="32" r="28" stroke="url(#campiiOrangeOrbit)" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6" />
  <circle cx="32" cy="32" r="24" stroke="#fb923c" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Outer Glassmorphic Hexagonal Campus Citadel -->
  <path d="M32 6L54 18V46L32 58L10 46V18L32 6Z" fill="url(#campiiOrangeFrost)" stroke="url(#campiiOrangeShield)" stroke-width="2" stroke-linejoin="round" />

  <!-- Frosted Specular Rim Reflection -->
  <path d="M32 7.5L52.5 18.7V25L32 13.5L11.5 25V18.7L32 7.5Z" fill="url(#campiiOrangeBevel)" opacity="0.7" />

  <!-- Base Plaza -->
  <path d="M20 44H44L41 47H23L20 44Z" fill="#fb923c" opacity="0.85" />

  <!-- Central Academic Hall Columns & Arch -->
  <path d="M22 43V27C22 21.4772 26.4772 17 32 17C37.5228 17 42 21.4772 42 27V43" stroke="url(#campiiOrangeTower)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Interior Arch Gateway Cutout -->
  <path d="M27 43V31C27 28.2386 29.2386 26 32 26C34.7614 26 37 28.2386 37 31V43" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" fill="#180e06" fill-opacity="0.8" />

  <!-- Central University Pinnacle Spire -->
  <path d="M32 10V17" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="10" r="1.8" fill="#f97316" stroke="#ffffff" stroke-width="0.8" />

  <!-- Glowing Nexus Crossbeam -->
  <line x1="18" y1="35" x2="46" y2="35" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Orbiting Academic Nodes -->
  <circle cx="32" cy="6" r="3.2" fill="#ffffff" stroke="#f97316" stroke-width="1.5" />
  <circle cx="54" cy="46" r="3.2" fill="#fb923c" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="10" cy="46" r="3.2" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />

  <!-- Pulsing Core Energy Gem -->
  <circle cx="32" cy="30" r="3" fill="#ff6b00" />
  <circle cx="32" cy="30" r="1.5" fill="#ffffff" />
